version: '3'

services:
  api-gateway:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./nginx/conf.d:/usr/local/openresty/nginx/conf/conf.d
      - ./nginx/lua:/usr/local/openresty/nginx/conf/lua
    depends_on:
      - users-service
      - products-service
      - orders-service

  users-service:
    image: alpine
    command: |
      sh -c "apk add --no-cache netcat-openbsd && while true; do echo -e 'HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nConnection: close\r\n\r\n{\"service\":\"users\",\"status\":\"ok\"}' | nc -l -p 8001; done"
    expose:
      - "8001"

  products-service:
    image: alpine
    command: |
      sh -c "apk add --no-cache netcat-openbsd && while true; do echo -e 'HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nConnection: close\r\n\r\n{\"service\":\"products\",\"status\":\"ok\"}' | nc -l -p 8002; done"
    expose:
      - "8002"

  orders-service:
    image: alpine
    command: |
      sh -c "apk add --no-cache netcat-openbsd && while true; do echo -e 'HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nConnection: close\r\n\r\n{\"service\":\"orders\",\"status\":\"ok\"}' | nc -l -p 8003; done"
    expose:
      - "8003"