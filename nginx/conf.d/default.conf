server {
    listen       80;
    server_name  localhost;

    # Access log
    access_log  /var/log/nginx/host.access.log  main;

    # API Gateway endpoints
    location /api/ {
        # Set headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API Gateway processing
        access_by_lua_file /etc/nginx/lua/gateway.lua;
        
        # Backend service routing (will be handled by Lua)
        proxy_pass http://127.0.0.1:8080;
    }

    # Health check endpoint
    location /health {
        return 200 '{"status": "UP"}';
        default_type application/json;
    }

    # API Documentation - placeholder, can be replaced with actual docs
    location /docs {
        default_type text/html;
        return 200 '<html><body><h1>API Gateway Documentation</h1><p>Documentation will be available here.</p></body></html>';
    }

    # Error handling
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}